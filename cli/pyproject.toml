[project]
name = "assay-cli"
dynamic = ["version"]
authors = [{ name = "Francesco Campanile" }]
description = "Assay's command line: run Assay's tests, test sets, plans and statistics batches from a CI/CD pipeline, and fail the step when they fail."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",   # The CLI talks to Assay's API, never to its database or worker
    "pyyaml>=6.0",   # Gate policy files (assay-gate.yml), read with safe_load
]

[project.scripts]
assay = "assay_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/assay_cli/__init__.py"  # the one place the version is written

[tool.hatch.build.targets.wheel]
packages = ["src/assay_cli"]
