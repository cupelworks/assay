[project]
name = "assay-cli"
version = "0.1.0"
authors = [{ name = "Francesco Campanile" }]
description = "Assay's command line: run Assay's tests, test sets, plans and statistics batches from a CI/CD pipeline, and fail the step when they fail."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",  # The only dependency: the CLI talks to Assay's API, never to its database or worker
]

[project.scripts]
assay = "assay_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay_cli"]
