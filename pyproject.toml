[project]
name = "assay"
version = "0.9.3"
authors = [{ name = "Francesco Campanile", email = "francescocampanile96@gmail.com" }]
description = "Test how a GenAI-powered application behaves: score its outputs with deterministic checks, NLP metrics and LLM-as-judge verdicts, organise cases into test sets and plans, and keep a reproducible record of every run."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",                          # HTTP framework — routes, request/response handling, OpenAPI docs
    "uvicorn[standard]>=0.32",                 # ASGI server — runs the FastAPI app
    "pydantic>=2.9",                           # Data validation and domain models (TestCase, EvaluationRun, etc.)
    "pydantic-settings>=2.6",                  # Environment-based configuration via the Settings class
    "sqlalchemy[asyncio]>=2.0",                # ORM and async engine (works with both SQLite and PostgreSQL)
    "alembic>=1.13",                           # Database migration tool — tracks schema changes over time
    "asyncpg>=0.30",                           # Async PostgreSQL driver — used in prod via postgresql+asyncpg:// URLs
    "prometheus-fastapi-instrumentator>=7.0",  # Prometheus /metrics endpoint and request instrumentation
    "celery[redis]>=5.4",                      # API dispatches execute_run via a producer-only send_task() call
                                                # (services/runs/_common.py) — never imports the worker's task or
                                                # evaluator modules, see docs/run_execution/dev_notes.md notes 10-11
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",      # Test runner
    "pytest-cov>=5.0",  # Coverage reporting — run with --cov=assay --cov-report=term-missing
    "httpx>=0.27",      # Async HTTP client used by FastAPI's TestClient in tests
    "ruff>=0.7",        # Linter and formatter
    "aiosqlite>=0.20",  # Async SQLite driver — local dev only (prod uses asyncpg)
    "flower>=2.0",      # Web dashboard for Celery task/worker history — celery -A assay.worker flower
]
anthropic = [
    "anthropic>=0.28",  # Anthropic Messages API client (used by AnthropicClient in llm.py)
]
openai = [
    "openai>=1.35",  # OpenAI Chat Completions client (used by OpenAIClient in llm.py)
]
worker = [
    "psycopg2-binary>=2.9",  # Sync PostgreSQL driver for assay.worker.db — the worker's tasks use a
                             # sync SQLAlchemy session (see docs/run_execution/dev_notes.md note 4),
                             # never asyncpg. Only needed against production Postgres; SQLite's sync
                             # driver is the stdlib, nothing extra to install for local dev.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# G / LOG: logging call conventions — %-style lazy formatting (no f-strings),
# logger.exception() inside except blocks, no logging.getLogger(__file__), ...
select = ["E", "F", "I", "UP", "B", "SIM", "G", "LOG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
