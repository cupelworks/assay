# Removes Assay's staging environment from your Azure subscription: every
# resource the Terraform in infra/azure created there, the database and its
# backups included.
#
# A TEMPLATE: it does nothing in the Assay repository itself (the job skips
# there). Copy it into your own PRIVATE deployment repository as
# .github/workflows/destroy.yml, next to deploy.yml. It uses deploy.yml's
# setup (infra/azure/README.md): the staging GitHub environment's variables
# and secrets, and the Azure identity GitHub logs in as.
#
# It runs only when started by hand (Actions → Destroy Assay's staging → Run
# workflow), and only when the name typed in matches: staging. Production is
# never removed from here: nothing in a private repository on GitHub Team can
# require someone's approval first, so whoever can push could press it.
# Remove production from your machine (README, "Removing it").
#
# What one run does:
#   1. checks the typed name;
#   2. deletes the environment's log workspace for good (Azure would otherwise
#      keep it 14 days, and bring the old logs back into the next staging);
#   3. terraform destroy: everything else, the Key Vault purged.
#
# It leaves the sign-in's app registration: the identity has no rights in your
# directory. The next push to main creates staging again, from scratch.

name: Destroy Assay's staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type staging to remove it, with its database"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # the deploy's group: never while staging deploys, never cancelled halfway
  group: deploy-staging
  cancel-in-progress: false

jobs:
  destroy:
    # the template's own repository never destroys
    if: github.repository != 'cupelworks/assay'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write # log in to Azure with OIDC
    env:
      TF_DIR: environments/staging
      TF_IN_AUTOMATION: "true"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_entra_client_id: ${{ vars.ENTRA_CLIENT_ID }}
      TF_VAR_entra_client_secret: ${{ secrets.ENTRA_CLIENT_SECRET }}
    steps:
      - name: The name typed in
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "staging" ]; then
            echo "::error::Typed '${CONFIRM}', not 'staging': nothing was removed."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"

      - name: Delete the logs for good
        working-directory: ${{ env.TF_DIR }}
        run: |
          # the workspace's group and name, from Terraform's own record
          read -r rg name <<< "$(terraform show -json | jq -r '
            [.. | objects | select(.type? == "azurerm_log_analytics_workspace") | .values
             | "\(.resource_group_name) \(.name)"] | first // empty')"
          if [ -z "$name" ]; then
            echo "No log workspace in the state: nothing to delete."
            exit 0
          fi
          # A plain request: az's own delete waits on a background thread, where
          # its Python can deadlock loading the login
          az rest --method delete --url "https://management.azure.com/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${rg}/providers/Microsoft.OperationalInsights/workspaces/${name}?api-version=2023-09-01&force=true"
          # Azure finishes in the background: wait until it's gone (az's exit
          # code 3 is "not found") before Terraform reads it
          for _ in $(seq 1 30); do
            status=0
            az monitor log-analytics workspace show --resource-group "$rg" \
              --workspace-name "$name" --output none 2>/dev/null || status=$?
            if [ "$status" -eq 3 ]; then
              echo "$name deleted for good."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$name is still there after 5 minutes; nothing else was removed."
          exit 1

      - name: Terraform destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          # deleting the Container Apps environment can take 40 minutes
          terraform destroy -input=false -auto-approve
          cat <<EOF
          Staging is removed. The sign-in's app registration (${TF_VAR_entra_client_id})
          is still there: if you're done with it, az ad app delete --id ${TF_VAR_entra_client_id}.
          The next push to main creates staging again, at a new address.
          EOF
